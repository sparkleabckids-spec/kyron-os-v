name: Build Kyron OS Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Project Structure & Install
      run: |
        # Check if project is nested inside kyron-os-v
        if [ -d "kyron-os-v" ]; then
          cd kyron-os-v
        fi
        
        # Ensure src is in the right place
        if [ ! -d "src" ] && [ -d "../src" ]; then
          cp -r ../src ./
        fi

        rm -rf node_modules package-lock.json
        npm install

    - name: Build Web App
      run: |
        if [ -d "kyron-os-v" ]; then
          cd kyron-os-v
        fi
        npm run build

    - name: Package Dist Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KyronOS-Windows-Build
        path: |
          dist/
          kyron-os-v/dist/
