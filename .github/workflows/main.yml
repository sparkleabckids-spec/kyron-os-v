name: Build Kyron OS Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clean, Install & Build App
      run: |
        set -e
        # Move src into place if present at root
        if [ -d "src" ]; then
          mkdir -p kyron-os-v
          cp -r src kyron-os-v/
        fi

        # Enter project directory if it exists, otherwise stay in root
        if [ -f "kyron-os-v/package.json" ]; then
          cd kyron-os-v
        fi

        # Clean old Windows node_modules
        rm -rf node_modules package-lock.json

        # Fresh install & build
        npm install
        npm run build

    - name: Package Dist Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KyronOS-Windows-Build
        path: |
          dist
          kyron-os-v/dist
