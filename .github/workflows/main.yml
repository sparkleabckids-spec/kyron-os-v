name: Build Kyron OS Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install & Build App
      run: |
        rm -rf node_modules package-lock.json
        npm install
        npm run build

    - name: Package Dist Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KyronOS-Windows-Build
        path: dist
