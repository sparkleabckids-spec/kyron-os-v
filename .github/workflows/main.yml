name: Build Kyron OS Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Dynamic Path Fix, Install & Build App
      run: |
        set -e

        # 1. Find where index.html and package.json actually exist
        TARGET_DIR=$(dirname $(find . -name "index.html" | head -n 1))
        echo "Found project root at: $TARGET_DIR"

        # 2. Find where the uploaded src folder is located
        SRC_DIR=$(find . -type d -name "src" | head -n 1)
        echo "Found src at: $SRC_DIR"

        # 3. Copy src into the target directory if not already there
        if [ "$TARGET_DIR" != "$SRC_DIR" ] && [ -n "$SRC_DIR" ]; then
          cp -r "$SRC_DIR" "$TARGET_DIR/"
        fi

        # 4. Navigate to project root
        cd "$TARGET_DIR"

        # 5. Clean stale node_modules & build
        rm -rf node_modules package-lock.json
        npm install
        npm run build

    - name: Package Dist Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KyronOS-Windows-Build
        path: "**/dist/**"
